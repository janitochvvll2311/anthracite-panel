[package]
name = "anth-plugin-wireguard"
version = "0.2.0"
edition = "2024"
description = "Reference plugin: WireGuard interface management for anth-panel"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
