<!doctype html>
<html lang="en" data-viewport="desktop" data-viewport-mode="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Anthracite</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-drawer="closed">
    <header id="topbar" class="topbar">
      <button
        id="nav-toggle"
        class="ghost icon nav-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <strong>Anthracite</strong>
      </div>
      <span id="health" class="health" data-state="offline">connecting…</span>
      <div class="grow"></div>
      <div id="actions" class="actions" aria-label="Actions"></div>
      <button
        id="manager-button"
        class="ghost"
        type="button"
        aria-label="Manager"
        title="Installed apps and composition"
      >
        <span class="ghost-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="4.2" height="4.2" rx="1"/><rect x="9.3" y="2.5" width="4.2" height="4.2" rx="1"/><rect x="2.5" y="9.3" width="4.2" height="4.2" rx="1"/><rect x="9.3" y="9.3" width="4.2" height="4.2" rx="1"/></svg>
        </span> <span class="label">Manager</span>
      </button>
      <button
        id="settings-button"
        class="ghost"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <span aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h3.2M9.3 4h4.2M2.5 8h6.2M12.3 8h1.2M2.5 12h2.2M8.3 12h5.2"/><path d="M7.1 2.5v3M10.9 6.5v3M5.1 10.5v3"/></svg>
        </span> <span class="label">Settings</span>
      </button>
    </header>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title">Workspace</div>
          <button id="drawer-close" class="ghost small drawer-close" type="button">
            Close
          </button>
        </div>
        <nav id="views" aria-label="Views"></nav>
        <div id="warnings" class="warnings" aria-live="polite"></div>
        <details id="developer" class="developer" open>
          <summary>Developer</summary>
          <div class="viewport-row">
            <label for="viewport-select">Viewport</label>
            <select id="viewport-select" class="viewport-select" aria-label="Viewport mode">
              <option value="auto">Auto</option>
              <option value="desktop">Desktop</option>
              <option value="tablet">Tablet</option>
              <option value="mobile">Mobile</option>
            </select>
            <span id="viewport-effective" class="muted"></span>
          </div>
        </details>
        <footer class="sidebar-foot">
          <span>Anthracite</span>
          <span id="panel-version" class="muted">v0.5.0</span>
        </footer>
      </aside>

      <main id="workspace" class="workspace">
        <div id="tabs" class="tabs" role="tablist" aria-label="Open views"></div>
        <div id="panes" class="panes">
          <div id="empty" class="empty">
            <div class="empty-mark" aria-hidden="true"></div>
            <h2>Nothing open yet</h2>
            <p>Pick a view from the sidebar. Apps contribute the views; the panel owns the frame.</p>
          </div>
        </div>
      </main>
    </div>

    <div id="windows" class="windows"></div>

    <div id="stack" class="stack" role="toolbar" aria-label="Minimized views" hidden></div>

    <div id="settings" class="settings hidden" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-card">
        <header>
          <div>
            <strong>Settings</strong>
            <span class="muted">contributed by running apps</span>
          </div>
          <button id="settings-close" class="ghost" type="button">Close</button>
        </header>
        <div id="settings-body"></div>
      </div>
    </div>

    <div id="manager" class="manager hidden" role="dialog" aria-modal="true" aria-label="Manager">
      <div class="manager-card">
        <header>
          <div>
            <strong>Manager</strong>
            <span class="muted">installed apps, grants and composition</span>
          </div>
          <button id="manager-close" class="ghost" type="button">Close</button>
        </header>
        <div id="manager-body" class="manager-body"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
