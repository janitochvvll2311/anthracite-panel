[workspace]
members = [
    "anth-wire",
    "anth-client",
    "anth-host",
    "anth-plugin",
    "anth-extension",
    "anth-panel",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
anth-wire = { path = "anth-wire" }
anth-client = { path = "anth-client" }
anth-host = { path = "anth-host" }
anth-plugin = { path = "anth-plugin" }
anth-extension = { path = "anth-extension" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = "0.25"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
argon2 = { version = "0.5", features = ["std"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rust-embed = "8.13"
tower = { version = "0.5", features = ["util"] }
# Archives are handled in-tree: the runtime image has no `7z` or `xz`, and its
# `tar` is BusyBox, whose escape handling is not the guard this daemon needs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"
lzma-rust2 = { version = "0.2", default-features = false }
crc32fast = "1"
crc = "3"
sevenz-rust2 = "0.13"
flate2 = "1"
portable-pty = "0.9"
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
bytes = "1"
http-body-util = "0.1"
