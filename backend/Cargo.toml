[workspace]
members = ["anth-wire", "anth-host", "anth-plugin", "anth-panel"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anth-wire = { path = "anth-wire" }
anth-host = { path = "anth-host" }
anth-plugin = { path = "anth-plugin" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"] }
toml = "0.9"
wasmi = "2"
sha2 = { version = "0.10", default-features = false }
# A byte slice on the wire that is not UTF-8: `serde_json` would turn a
# `Vec<u8>` into an array of numbers, tripling it at the boundary.
base64 = "0.22"
wasmi_core = "2"
# The SSE route needs one stream combinator (`unfold`) to turn a ticker into
# frames. `axum` already pulls this crate in, so naming it adds no compile unit.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The REPL needs termios for raw mode. `libc` is already in the tree via other
# crates, and a raw terminal has no std-only spelling.
libc = "0.2"
# Authentication: Argon2id for the password, HS256 for the access token. The
# password hash is slow on purpose (19 MiB, two passes); a login pays it once.
argon2 = { version = "0.5", features = ["std"] }
# A JWT is a signature over a header and a few claims. `rust_crypto` picks the
# pure-Rust backend, because the pinned musl target has no ring/aws-lc build.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Entropy for the signing key and the refresh tokens. A guessable signing key
# would let anyone mint an access token.
getrandom = "0.3"
# Editing `config.toml` in place: `toml` round-trips through a map and would
# drop the operator's comments and key order.
toml_edit = "0.25"
