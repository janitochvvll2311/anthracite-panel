[workspace]
members = ["anth-wire", "anth-host", "anth-plugin", "anth-panel"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
anth-wire = { path = "anth-wire" }
anth-host = { path = "anth-host" }
anth-plugin = { path = "anth-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = "0.25"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rust-embed = "8.13"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
