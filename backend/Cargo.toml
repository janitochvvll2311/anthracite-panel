[workspace]
members = ["anth-wire", "anth-host", "anth-plugin", "anth-paneld"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anth-wire = { path = "anth-wire" }
anth-host = { path = "anth-host" }
anth-plugin = { path = "anth-plugin" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"] }
toml = "0.9"
wasmi = "2"
sha2 = { version = "0.10", default-features = false }
wasmi_core = "2"
