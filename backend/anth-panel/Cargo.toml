[package]
name = "anth-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
anth-proto = { path = "../anth-proto" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
mime_guess = "2.0.5"
libc = "0.2"
portable-pty = "0.9"
rust-embed = "8.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
