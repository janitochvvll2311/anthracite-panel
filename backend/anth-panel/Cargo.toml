[package]
name = "anth-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
# Archives are handled in-tree: the runtime image has no `7z` or `xz`, and its
# `tar` is BusyBox, whose escape handling is not the guard this daemon needs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"
lzma-rust2 = { version = "0.2", default-features = false }
crc32fast = "1"
crc = "3"
sevenz-rust2 = "0.13"
flate2 = "1"
anth-proto = { path = "../anth-proto" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
mime_guess = "2.0.5"
libc = "0.2"
portable-pty = "0.9"
rust-embed = "8.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"

[dev-dependencies]
# Compiles the fixture guest in tests only: the shipped binary has no business
# carrying a text-format wasm parser.
wat = "1"
# The 7z fixture cannot come from this crate (it has no writer), so the test
# uses the compressor directly.
sevenz-rust2 = "0.13"
http-body-util = "0.1"
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }

[target.x86_64-unknown-linux-musl.dependencies]
wasmi = "2.0.0"
