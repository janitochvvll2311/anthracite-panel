[package]
name = "anth-panel"
version.workspace = true
edition.workspace = true

[dependencies]
anth-wire.workspace = true
anth-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
axum.workspace = true
toml.workspace = true
wasmi.workspace = true
sha2.workspace = true
wasmi_core.workspace = true
libc.workspace = true
# Reading a bundle: `package.sh` ships a zip, so install must open one.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The shell is compiled into the binary. `debug-embed` makes a debug build read
# `www/` from disk instead, so a frontend rebuild needs no Rust rebuild.
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies]
# The runtime tests compile a real guest from WAT, so the sandbox is proven
# against wasm rather than a mock of it.
wat = "1"
# The API tests drive the router with `oneshot`, so they exercise the real
# handlers without binding a port.
tower = { version = "0.5", features = ["util"] }
