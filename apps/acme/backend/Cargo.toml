[package]
name = "acme-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RFC 8555 client for Anthracite: accounts, orders, HTTP-01 and DNS-01"

[[bin]]
name = "acme-service"
path = "src/main.rs"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
anth-service = { path = "../../../sdk/rust/service" }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem", "sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal", "process"] }
url = "2"
webpki-roots = "1"
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
futures-util = "0.3"
rcgen = { version = "0.13", features = ["x509-parser"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }

[workspace]
