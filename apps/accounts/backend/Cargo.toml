[package]
name = "accounts-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host users and groups, lock state and guarded account changes for the Accounts app"

[[bin]]
name = "accounts-service"
path = "src/main.rs"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
anth-service = { path = "../../../sdk/rust/service" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[workspace]
