manifest_version = 2

[app]
id = "org.anthracite.hello"
alias = "hello"
namespace = "anthracite:hello"
name = "Hello"
version = "0.1.0"

[wasm]
path = "wasm/app.wasm"
sha256 = "dea0206e4f454737e4be182b8f2d544f22aa84cab2229e5e8aa9da6d35851493"

[[export]]
interface = "anthracite:hello/greeting@1.0.0"

[[import]]
interface = "anth:env/time@1.0.0"

[[route]]
method = "GET"
path = "/hello"
call = "anthracite:hello/greeting@1.0.0#greet"

[[slot]]
id = "panel.view"
label = "Hello"
icon = "hello"
order = 1
tag = "hello"
module = "web/hello.js"
sha256 = "f6239d30bd1a00feb7f86ccd3375fb6b3b91080605f2c9849ca734b57b7732a3"

[[slot]]
id = "panel.action"
label = "Greet"
icon = "bolt"
order = 2
tag = "hello-greet"
module = "web/hello.js"
sha256 = "f6239d30bd1a00feb7f86ccd3375fb6b3b91080605f2c9849ca734b57b7732a3"

[[slot]]
id = "panel.settings"
label = "Hello"
icon = "gear"
order = 3
tag = "hello-settings"
module = "web/hello.js"
sha256 = "f6239d30bd1a00feb7f86ccd3375fb6b3b91080605f2c9849ca734b57b7732a3"

[[cli]]
call = "anthracite:hello/greeting@1.0.0#greet"
verb = "greet"
