[package]
name = "certs-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Certificate inventory, custody and publication for the Certificates app"

[[bin]]
name = "certs-service"
path = "src/main.rs"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
anth-service = { path = "../../../sdk/rust/service" }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
p256 = { version = "0.13", features = ["pkcs8"] }
rsa = "0.9"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
rcgen = "0.13"

[workspace]
