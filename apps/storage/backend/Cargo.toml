[package]
name = "storage-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host block devices, mounts and usage for the Storage app"

[[bin]]
name = "storage-service"
path = "src/main.rs"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
anth-service = { path = "../../../sdk/rust/service" }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[workspace]
