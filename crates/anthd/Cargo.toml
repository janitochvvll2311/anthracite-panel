[package]
name = "anthd"
version = "0.1.0"
edition = "2021"

[dependencies]
anth-conf = { version = "0.1.0", path = "../anth-conf" }
anth-proto = { path = "../anth-proto" }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
