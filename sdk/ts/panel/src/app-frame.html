<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <title>Anthracite app</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #141821;
        --line: #2a3142;
        --text: #e8ebf2;
        --muted: #8f98ab;
        --accent: #7aa2ff;
      }
      * { box-sizing: border-box; }
      html { background: transparent; }
      html, body { margin: 0; padding: 0; background: transparent; }
      html { background: transparent; }
      body {
        background: transparent;
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <script>
      // The sandboxed side of the panel contract. This classic script runs in an
      // opaque origin, receives the app module source from the panel, imports it
      // from a blob, and forwards every request through a scoped RPC.
      (() => {
        const pending = new Map();
        const pendingViews = new Map();
        let token = "";
        let dispose = null;
        let moduleApi = null;

        const send = (type, payload = {}) => {
          parent.postMessage({ type, token, ...payload }, "*");
        };

        const responseLike = (meta, body, text) => ({
          ok: meta.ok,
          status: meta.status,
          statusText: meta.statusText,
          headers: {
            get: (name) => meta.headers[String(name).toLowerCase()] ?? null,
            forEach: (callback) =>
              Object.entries(meta.headers).forEach(([name, value]) =>
                callback(value, name),
              ),
          },
          body,
          text,
          json: async () => JSON.parse(await text()),
        });

        const request = (input, init = {}) => {
          const url = typeof input === "string" ? input : input.url;
          const headers = init.headers
            ? Object.fromEntries(new Headers(init.headers))
            : {};
          const body =
            init.body == null
              ? undefined
              : typeof init.body === "string"
                ? init.body
                : String(init.body);
          const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
          return new Promise((resolve, reject) => {
            let controller = null;
            let settled = false;
            const call = {
              reject: (error) => {
                if (settled) return;
                settled = true;
                pending.delete(id);
                reject(error);
              },
              buffered: (result) => {
                if (settled) return;
                settled = true;
                pending.delete(id);
                resolve(responseLike(result, null, async () => result.body));
              },
              head: (meta) => {
                if (settled) return;
                settled = true;
                const stream = new ReadableStream({
                  start: (value) => {
                    controller = value;
                  },
                  cancel: () => {
                    pending.delete(id);
                    send("anth:stream-cancel", { id });
                  },
                });
                resolve(
                  responseLike(meta, stream, async () => {
                    const reader = stream.getReader();
                    const decoder = new TextDecoder();
                    let text = "";
                    for (;;) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      text += decoder.decode(value, { stream: true });
                    }
                    return text + decoder.decode();
                  }),
                );
              },
              chunk: (data) => {
                if (controller) controller.enqueue(new Uint8Array(data));
              },
              end: (error) => {
                pending.delete(id);
                if (!controller) return;
                if (error) controller.error(new Error(error));
                else controller.close();
              },
            };
            pending.set(id, call);
            send("anth:fetch", {
              id,
              url,
              init: { method: init.method ?? "GET", headers, body },
            });
          });
        };

        const report = () => {
          const height = Math.ceil(document.documentElement.scrollHeight);
          if (height > 0) send("anth:resize", { height });
        };

        const openView = (request) =>
          new Promise((resolve) => {
            const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            pendingViews.set(id, resolve);
            send("anth:open-view", { ...request, requestId: id });
            setTimeout(() => {
              if (pendingViews.delete(id)) resolve(false);
            }, 1200);
          });

        window.addEventListener("message", async (event) => {
          if (event.source !== parent) return;
          const message = event.data;
          if (!message || typeof message !== "object") return;

          if (message.type === "anth:mount") {
            token = message.token;
            try {
              const blob = new Blob([message.source], {
                type: "text/javascript",
              });
              const url = URL.createObjectURL(blob);
              const module = await import(url);
              URL.revokeObjectURL(url);
              if (typeof module.mount !== "function") {
                throw new Error(
                  "the module does not export mount(root, context)",
                );
              }
              moduleApi = module;
              const context = {
                ...message.context,
                fetch: request,
                close: () => send("anth:close"),
                openView,
                updateParams: (params) => send("anth:params", { params }),
                fill: () => send("anth:fill"),
              };
              dispose = await module.mount(document.body, context);
              send("anth:mounted");
              report();
            } catch (error) {
              send("anth:error", {
                message:
                  error instanceof Error ? error.message : String(error),
              });
            }
          } else if (message.type === "anth:fetch-result") {
            const call = pending.get(message.id);
            if (!call) return;
            if (message.result?.error) {
              call.reject(new Error(message.result.error));
            } else {
              call.buffered(message.result);
            }
          } else if (message.type === "anth:stream-head") {
            const call = pending.get(message.id);
            if (call) call.head(message);
          } else if (message.type === "anth:stream-chunk") {
            const call = pending.get(message.id);
            if (call) call.chunk(message.data);
          } else if (message.type === "anth:stream-end") {
            const call = pending.get(message.id);
            if (call) call.end(message.error);
          } else if (message.type === "anth:open-view-result") {
            const resolve = pendingViews.get(message.requestId);
            if (!resolve) return;
            pendingViews.delete(message.requestId);
            resolve(message.ok === true);
          } else if (message.type === "anth:update-params") {
            if (typeof moduleApi?.onParams === "function") {
              moduleApi.onParams(message.params);
            }
          } else if (message.type === "anth:request-close") {
            let ok = true;
            try {
              if (typeof moduleApi?.beforeClose === "function") {
                send("anth:close-pending", {
                  requestId: message.requestId,
                });
                ok = (await moduleApi.beforeClose()) !== false;
              }
            } catch {
              ok = false;
            }
            send("anth:close-result", {
              requestId: message.requestId,
              ok,
            });
          } else if (message.type === "anth:request-snapshot") {
            let value = null;
            try {
              if (typeof moduleApi?.snapshot === "function") {
                value = (await moduleApi.snapshot()) ?? null;
              }
            } catch {
              value = null;
            }
            send("anth:snapshot-result", {
              requestId: message.requestId,
              value,
            });
          } else if (message.type === "anth:unmount") {
            try {
              if (typeof dispose === "function") await dispose();
            } finally {
              dispose = null;
              moduleApi = null;
              document.body.replaceChildren();
            }
          }
        });

        if (typeof ResizeObserver === "function") {
          new ResizeObserver(report).observe(document.body);
        }
        send("anth:frame-ready");
      })();
    </script>
  </body>
</html>
