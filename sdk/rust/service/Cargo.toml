[package]
name = "anth-service"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["anthracite", "service", "sdk"]
categories = ["development-tools"]
repository = "https://github.com/janitochvvll2311/anthracite-panel"
description = "The native service side of the engine's private WIT-RPC protocol"

[dependencies]
anth-error = { version = "0.8.0", path = "../../../engine/error" }
base64 = "0.22"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
