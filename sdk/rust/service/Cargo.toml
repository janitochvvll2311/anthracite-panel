[package]
name = "anth-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The native service side of the engine's private WIT-RPC protocol"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
