[package]
name = "anth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `anth` command: a thin client for the Anthracite engine"

[[bin]]
name = "anth"
path = "src/main.rs"

[dependencies]
anth-contract = { path = "../../../engine/contract" }
form_urlencoded = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
