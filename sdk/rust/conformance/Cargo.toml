[package]
name = "anth-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The offline conformance kit for Anthracite app bundles"

[[bin]]
name = "anth-conformance"
path = "src/main.rs"

[dependencies]
anth-compose = { path = "../../../engine/compose" }
anth-contract = { path = "../../../engine/contract", features = ["parse"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
sha2 = "0.11"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
