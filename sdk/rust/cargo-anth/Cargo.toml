[package]
name = "cargo-anth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Create, build, package, sign and verify Anthracite apps"
repository = "https://github.com/janitochvvll2311/anthracite-panel"
homepage = "https://github.com/janitochvvll2311/anthracite-panel"
documentation = "https://docs.rs/cargo-anth"
readme = "README.md"
keywords = ["anthracite", "wasm", "apps", "sdk"]
categories = ["development-tools", "wasm"]

[[bin]]
name = "cargo-anth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
