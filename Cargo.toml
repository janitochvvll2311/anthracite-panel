[workspace]
members = ["anth-wire", "anth-host", "anth-paneld"]
# v1/ is the frozen v0.1.0 tree with its own workspace at v1/backend. Without
# this, crates under it that are not workspace members (the WireGuard plugin)
# walk up, find this manifest and refuse to build.
exclude = ["v1"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anth-wire = { path = "anth-wire" }
anth-host = { path = "anth-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"] }
