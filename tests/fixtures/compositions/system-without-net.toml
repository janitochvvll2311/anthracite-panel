version = 1

# The system composition without `net`. Firewall keeps its parent reference in
# its manifest; the panel falls back to a top-level tab when the parent is gone.
[[profile]]
id = "default"
apps = [
    "org.anthracite.fs",
    "org.anthracite.terminal",
    "org.anthracite.proc",
    "org.anthracite.firewall",
    "org.anthracite.storage",
    "org.anthracite.accounts",
    "org.anthracite.home",
]
