[package]
name = "anth-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The composer: composition plus installed manifests, resolved into what runs"

[dependencies]
anth-contract = { path = "../contract", features = ["parse"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
libc = "0.2"
sha2 = "0.10"
wit-parser = "0.263"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
