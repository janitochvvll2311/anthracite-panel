[workspace]
resolver = "2"
members = ["contract"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
toml = "1"
semver = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
