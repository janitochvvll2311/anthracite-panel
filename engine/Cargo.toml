[workspace]
resolver = "2"
members = ["auth", "contract", "runtime", "api", "daemon", "compose"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
semver = "1"
toml = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "signal",
    "net",
    "fs",
    "io-util",
    "time",
    "process",
] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
