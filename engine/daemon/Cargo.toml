[package]
name = "anth-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Anthracite engine: a headless daemon that composes apps"

[[bin]]
name = "anth-engine"
path = "src/main.rs"

[dependencies]
anth-api = { path = "../api" }
anth-contract = { path = "../contract", features = ["parse"] }
axum = { workspace = true }
humantime = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
