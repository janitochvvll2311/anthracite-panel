name: ci

on:
  push:
    branches: [v0.5.0]
  pull_request:
    branches: [v0.5.0]

jobs:
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  apps:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.263.0

      - name: Format
        run: cargo fmt --manifest-path apps/Cargo.toml --all --check

      # No `wit/deps` is committed: hello's build script mirrors the SDK
      # catalog, which is what proves the guest facade injects it.
      - name: Build and verify the committed component
        run: |
          set -eu
          scripts/build-app.sh apps/hello
          sha=$(sha256sum apps/hello/wasm/app.wasm | cut -d' ' -f1)
          grep -q "sha256 = \"$sha\"" apps/hello/manifest.toml

  panel:
    name: panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.263.0

      - name: Codegen is current
        run: bun scripts/codegen.ts apps/hello --check

      - name: Test the panel contract
        working-directory: sdk/ts/panel
        run: bun run test

      - name: Test the generated TypeScript client
        working-directory: sdk/ts/client
        run: bun test

      - name: Test the shell
        working-directory: panel/frontend
        run: |
          bun install
          bun test

      - name: Build the frontend
        working-directory: panel/frontend
        run: bun run build

      # The second panel uses only sdk/ts/panel; building it here keeps the
      # acid test's other side compiling.
      - name: Test the second panel
        working-directory: sdk/ts/panel/examples/minimal-panel
        run: |
          bun install
          bun test

      - name: Build the second panel
        working-directory: sdk/ts/panel/examples/minimal-panel
        run: bun run build

      - name: Format
        run: cargo fmt --manifest-path panel/backend/Cargo.toml --all --check

      - name: Lint
        run: cargo clippy --manifest-path panel/backend/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path panel/backend/Cargo.toml

      # The release binary embeds dist; without it the build fails, by design.
      # `check` still runs the embed macro, without the cost of linking wasmtime.
      # The remote side of the acid test: a real panel process, the hello
      # bundle, and the generated Rust/TS clients speaking HTTP from outside.
      - name: Build the e2e panel and clients
        run: |
          scripts/build-app.sh apps/hello
          scripts/package-app.sh apps/hello /tmp/anthracite-panel/hello-e2e.zip
          cargo build --manifest-path sdk/rust/Cargo.toml -p anth-cli
          cargo build --manifest-path panel/backend/Cargo.toml

      - name: Remote client acid test
        run: |
          set -eu
          mkdir -p /tmp/anthracite-panel
          dir=$(mktemp -d /tmp/anthracite-panel/remote-e2e.XXXXXX)
          panel=
          trap 'kill "$panel" 2>/dev/null || true; rm -rf "$dir"' EXIT
          cat > "$dir/config.toml" <<EOF
          version = 1
          socket = "$dir/engine.sock"
          state = "$dir/state"

          [apps]
          require-signature = false
          EOF

          start_panel() {
            ./target/debug/anth-panel --listen 127.0.0.1:8099 \
              --config "$dir/config.toml" --token test > "$dir/panel.log" 2>&1 &
            panel=$!
            for _ in $(seq 1 100); do
              curl -sf http://127.0.0.1:8099/health >/dev/null && return 0
              sleep 0.1
            done
            cat "$dir/panel.log"
            return 1
          }

          start_panel
          ./target/debug/anth --socket "$dir/engine.sock" app install /tmp/anthracite-panel/hello-e2e.zip
          ./target/debug/anth --socket "$dir/engine.sock" app approve org.anthracite.hello
          ./target/debug/anth --socket "$dir/engine.sock" compose --add org.anthracite.hello
          kill "$panel"
          wait "$panel" 2>/dev/null || true

          start_panel
          for _ in $(seq 1 100); do
            curl -sf -u operator:test http://127.0.0.1:8099/api/health >/dev/null && break
            sleep 0.1
          done
          ANTH_PANEL_URL=http://127.0.0.1:8099 ANTH_PANEL_AUTH=operator:test \
            tests/e2e/remote-client.sh

      - name: Release check
        run: cargo check --release --manifest-path panel/backend/Cargo.toml

  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      # The workspace is checked twice on purpose: once with the features a
      # crate gets by default, and once with the parser the engine enables.
      - name: Lint, default features
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint, with the parser
        run: cargo clippy -p anth-contract --features parse --all-targets -- -D warnings

      - name: Test, default features
        run: cargo test --workspace

      - name: Test, with the parser
        run: cargo test -p anth-contract --features parse

      # The client is a wrapper, so the test that proves it is one against the
      # real binary — before and after the engine has created its state.
      - name: Build the engine and the client
        run: |
          cargo build -p anth-engine
          cargo build --manifest-path ../sdk/rust/Cargo.toml

      - name: Doctor against the real engine
        run: |
          set -eu
          dir="$(mktemp -d)"
          printf 'version = 1\nsocket = "%s/engine.sock"\nstate = "%s/state"\n' "$dir" "$dir" > "$dir/config.toml"

          ../target/debug/anth doctor --config "$dir/config.toml"

          ../target/debug/anth-engine --debug --config "$dir/config.toml" &
          engine=$!
          trap 'kill "$engine" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [ -S "$dir/engine.sock" ] && break
            sleep 0.1
          done
          test -S "$dir/engine.sock" || { echo "the engine never bound its socket"; exit 1; }

          ../target/debug/anth doctor --config "$dir/config.toml" | tee "$dir/doctor.txt"
          grep -q "composition are valid" "$dir/doctor.txt"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The engine may not depend on the SDK, the panel or an app (§10.1).
      - name: Forbidden edges
        run: bun scripts/check-edges.mjs
        working-directory: .
