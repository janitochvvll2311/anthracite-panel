name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  demo:
    name: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path demo/emulator/Cargo.toml --all --check

      - name: Lint
        run: cargo clippy --manifest-path demo/emulator/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path demo/emulator/Cargo.toml

  apps:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-tools@1.263.0

      - name: Format
        run: cargo fmt --manifest-path apps/Cargo.toml --all --check

      # No `wit/deps` is committed: hello's build script mirrors the SDK
      # catalog, which is what proves the guest facade injects it.
      - name: Build and verify the committed component
        run: |
          set -eu
          scripts/build-app.sh apps/hello
          sha=$(sha256sum apps/hello/wasm/app.wasm | cut -d' ' -f1)
          grep -q "sha256 = \"$sha\"" apps/hello/manifest.toml

  panel:
    name: panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-tools@1.263.0

      - name: Codegen is current
        run: bun scripts/codegen.ts apps/hello --check

      - name: Test the panel contract
        working-directory: sdk/ts/panel
        run: bun run test

      - name: Test the generated TypeScript client
        working-directory: sdk/ts/client
        run: bun test

      - name: Typecheck the generated TypeScript client
        working-directory: sdk/ts/client
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Test the shell
        working-directory: panel/frontend
        run: |
          bun install
          bun test

      - name: Build the frontend
        working-directory: panel/frontend
        run: bun run build

      # The second panel uses only sdk/ts/panel; building it here keeps the
      # acid test's other side compiling.
      - name: Test the second panel
        working-directory: sdk/ts/panel/examples/minimal-panel
        run: |
          bun install
          bun test

      - name: Build the second panel
        working-directory: sdk/ts/panel/examples/minimal-panel
        run: bun run build

      - name: Format
        run: cargo fmt --manifest-path panel/backend/Cargo.toml --all --check

      - name: Lint
        run: cargo clippy --manifest-path panel/backend/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path panel/backend/Cargo.toml

      # The external bundle: authored outside apps/, signed with its own key,
      # installed, composed, served and answered by a real panel.
      - name: Format the external app
        run: cargo fmt --manifest-path tests/acid/app/Cargo.toml --check

      - name: External bundle acid test
        run: scripts/acid-test.sh

      # The remote side of the acid test: a real panel process, the hello
      # bundle, and the generated Rust/TS clients speaking HTTP from outside.
      - name: Build the e2e panel and clients
        run: |
          scripts/build-app.sh apps/hello
          scripts/package-app.sh apps/hello /tmp/anthracite-panel/hello-e2e.zip
          cargo build --manifest-path sdk/rust/Cargo.toml -p anth-cli -p anth-conformance -p anth-signer
          cargo build --manifest-path panel/backend/Cargo.toml

      - name: Conformance kit on the hello bundle
        run: ./target/debug/anth-conformance /tmp/anthracite-panel/hello-e2e.zip

      # The signer and the engine agree on the signed set, from outside: a fresh
      # key pair signs the packaged bundle and the kit verifies it.
      - name: Sign the hello bundle and check the signature
        run: |
          set -eu
          dir=$(mktemp -d /tmp/anthracite-panel/sign-e2e.XXXXXX)
          trap 'rm -rf "$dir"' EXIT
          key=$(./target/debug/anth-sign keygen --out "$dir/key" | awk '/^public_key/ {print $2}')
          test -n "$key"
          ANTHRACITE_SIGNING_KEY="$dir/key" ANTH_SIGN=./target/debug/anth-sign \
            scripts/package-app.sh apps/hello "$dir/hello-signed.zip"
          ./target/debug/anth-conformance --require-signature --key "$key" "$dir/hello-signed.zip"
          if ./target/debug/anth-conformance --require-signature "$dir/hello-signed.zip"; then
            echo "an untrusted signature must be refused" >&2
            exit 1
          fi

      - name: Remote client acid test
        run: |
          set -eu
          mkdir -p /tmp/anthracite-panel
          dir=$(mktemp -d /tmp/anthracite-panel/remote-e2e.XXXXXX)
          panel=
          trap 'kill "$panel" 2>/dev/null || true; rm -rf "$dir"' EXIT
          cat > "$dir/config.toml" <<EOF
          version = 1
          socket = "$dir/engine.sock"
          state = "$dir/state"

          [apps]
          require-signature = false
          EOF

          start_panel() {
            ./target/debug/anth-panel --listen 127.0.0.1:8099 \
              --config "$dir/config.toml" > "$dir/panel.log" 2>&1 &
            panel=$!
            for _ in $(seq 1 100); do
              curl -sf http://127.0.0.1:8099/health >/dev/null && return 0
              sleep 0.1
            done
            cat "$dir/panel.log"
            return 1
          }

          start_panel
          ./target/debug/anth --socket "$dir/engine.sock" app install /tmp/anthracite-panel/hello-e2e.zip
          ./target/debug/anth --socket "$dir/engine.sock" app fetch-wit org.anthracite.hello --out "$dir/wit"
          test -f "$dir/wit/hello.wit"
          ./target/debug/anth --socket "$dir/engine.sock" app approve org.anthracite.hello
          ./target/debug/anth --socket "$dir/engine.sock" compose --add org.anthracite.hello
          kill "$panel"
          wait "$panel" 2>/dev/null || true

          start_panel
          # Walk the panel's own way out of the first-boot gate: log in with the
          # generated password and change it through the panel session.
          password=$(sed -n 's/.*"password":"\([^"]*\)".*/\1/p' "$dir/state/credentials.txt")
          curl -sf -c "$dir/cookies" \
            -H 'content-type: application/json' \
            -d "{\"operator\":\"operator\",\"password\":\"$password\"}" \
            http://127.0.0.1:8099/api/engine/session >/dev/null
          curl -sf -b "$dir/cookies" -c "$dir/cookies" -X PATCH \
            -H 'content-type: application/json' \
            -d "{\"current_password\":\"$password\",\"new_password\":\"changed-password-123\"}" \
            http://127.0.0.1:8099/api/engine/operator >/dev/null
          for _ in $(seq 1 100); do
            curl -sf -b "$dir/cookies" http://127.0.0.1:8099/api/health >/dev/null && break
            sleep 0.1
          done
          ANTH_PANEL_URL=http://127.0.0.1:8099 ANTH_PANEL_OPERATOR=operator \
            ANTH_PANEL_PASSWORD=changed-password-123 \
            tests/e2e/remote-client.sh

      # The release binary embeds dist; without it the build fails, by design.
      # `check` still runs the embed macro, without the cost of linking wasmtime.
      - name: Release check
        run: cargo check --release --manifest-path panel/backend/Cargo.toml

  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      # The workspace is checked twice on purpose: once with the features a
      # crate gets by default, and once with the parser the engine enables.
      - name: Lint, default features
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint, with the parser
        run: cargo clippy -p anth-contract --features parse --all-targets -- -D warnings

      - name: Test, default features
        run: cargo test --workspace

      - name: Test, with the parser
        run: cargo test -p anth-contract --features parse

      # The client is a wrapper, so the test that proves it is one against the
      # real binary — before and after the engine has created its state.
      - name: Build the engine and the client
        run: |
          cargo build -p anth-engine
          cargo build --manifest-path ../sdk/rust/Cargo.toml

      - name: Doctor against the real engine
        run: |
          set -eu
          dir="$(mktemp -d)"
          printf 'version = 1\nsocket = "%s/engine.sock"\nstate = "%s/state"\n' "$dir" "$dir" > "$dir/config.toml"

          ../target/debug/anth doctor --config "$dir/config.toml"

          ../target/debug/anth-engine --debug --config "$dir/config.toml" &
          engine=$!
          trap 'kill "$engine" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [ -S "$dir/engine.sock" ] && break
            sleep 0.1
          done
          test -S "$dir/engine.sock" || { echo "the engine never bound its socket"; exit 1; }

          ../target/debug/anth doctor --config "$dir/config.toml" | tee "$dir/doctor.txt"
          grep -q "composition are valid" "$dir/doctor.txt"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The engine may not depend on the SDK, the panel or an app (§10.1).
      - name: Forbidden edges
        run: bun scripts/check-edges.mjs
        working-directory: .

  security:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o "$tmp/gitleaks.tar.gz" "$url"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          "$tmp/gitleaks" detect --source . --config .gitleaks.toml --log-opts=--all --redact --no-banner
