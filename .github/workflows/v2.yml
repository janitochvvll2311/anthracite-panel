name: v2

# v0.1.0 had no CI at all: `cargo test` was a local habit, so a suite could be
# green on a machine where `wasm32-unknown-unknown` happened to be installed and
# fail on a fresh clone (see docs/design/v0.2.0.md, lesson 4).
#
# Scope: the v0.2.0 tree. The frozen v0.1.0 tree under v1/ is not built here;
# it lives until phase E deletes it.

on:
  push:
    branches: [main, "v0.2.0"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "plugins/**"
      - ".github/workflows/v2.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "plugins/**"
      - ".github/workflows/v2.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The binary that ships is a release build, and release is not the same
      # code: `www` embeds its files instead of reading them, so its whole
      # lookup is a different branch that a debug run never enters. Testing one
      # profile and shipping the other is how a green suite misses a broken
      # deployed build.
      - name: Test (release)
        run: cargo test --workspace --release

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: ./build-shell.sh

      - name: The harness is not in a production build
        run: |
          if [ -e ../backend/anth-panel/www/harness.html ]; then
            echo "harness.html reached the shell" >&2
            exit 1
          fi
          test -f ../backend/anth-panel/www/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          # The shell as the daemon serves it, which is what `build-shell.sh`
          # stages. The old path named a package that no longer exists.
          path: backend/anth-panel/www
          if-no-files-found: error

  plugin:
    name: plugin hello
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hello
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Backend tests
        working-directory: plugins/hello/backend
        run: cargo test

      - name: Frontend install
        working-directory: plugins/hello/frontend
        run: bun install --frozen-lockfile

      - name: Frontend tests
        working-directory: plugins/hello/frontend
        run: bun test

      # Builds both halves and writes the manifest digest, which is the only
      # way to prove the two projects still compose into one bundle.
      - name: Package
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hello
          path: plugins/hello/dist/*.zip
          if-no-files-found: error
