name: v2

# v0.1.0 had no CI at all: `cargo test` was a local habit, so a suite could be
# green on a machine where `wasm32-unknown-unknown` happened to be installed and
# fail on a fresh clone (see docs/design/v0.2.0.md, lesson 4).
#
# Scope: the v0.2.0 workspace, which lives at the repository root. The frozen
# v0.1.0 tree under v1/ keeps its own status until phase E deletes it.

on:
  push:
    branches: [main, "v0.2.0"]
    paths: ["anth-wire/**", "anth-host/**", "anth-paneld/**", "Cargo.toml", "Cargo.lock", ".cargo/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["anth-wire/**", "anth-host/**", "anth-paneld/**", "Cargo.toml", "Cargo.lock", ".cargo/**", ".github/workflows/v2.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
