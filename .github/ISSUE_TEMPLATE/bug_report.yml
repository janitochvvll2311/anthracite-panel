name: Bug report
description: Report a reproducible problem in Anthracite.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Anthracite. Please search existing issues first.
        Do not report security vulnerabilities here; use the private advisory link
        from the issue chooser.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: The panel returns 500 when...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps, commands or configuration needed to reproduce it.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.7.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux distribution, Rust/Bun versions, browser, architecture
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or traces
      description: Remove secrets, tokens, personal data and private paths.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This is not a security vulnerability.
          required: true
