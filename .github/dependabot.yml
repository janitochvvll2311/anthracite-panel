version: 2
updates:
  # Routine Rust bumps arrive as one grouped pull request per run. Major bumps
  # are deliberate upgrades: open them by hand when the migration is planned.
  # Security updates ignore `update-types`, so advisories still get a PR.
  - package-ecosystem: cargo
    directories:
      - "/engine"
      - "/sdk/rust"
      - "/panel/backend"
      - "/apps"
      - "/demo/emulator"
      - "/demo/sessions"
      - "/tests/acid/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directories:
      - "/panel/frontend"
      - "/sdk/ts/client"
      - "/sdk/ts/panel"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
